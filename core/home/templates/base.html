<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page}}</title>
    <style>
  table, th, td {
  border: 1px solid black;
}
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-light bg-light justify-content-between shadow-lg p-3 mb-4 bg-body rounded">
  <a class="navbar-brand">Navbar</a>
  <form class="form-inline">
  {% if request.user.is_authenticated %}
    <a href="/logout/" class ="btn btn-success" type = "submit">Logout</a>
    {% else %}
    <a href="/login/" class="btn btn-success" type = "submit">Login</a>
    <a href="/register/" class="btn btn-success" type = "submit">Register</a>
  {% endif %}
  </form>
</nav>
{% block start %}

{% endblock %}
</body>
</html>
