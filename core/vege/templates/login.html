{% extends "base.html" %}
{% block start %}

<form method="POST" class="col-6 mx-auto card p-3 shadow-lg">

    {% csrf_token %}

    <h3>Login</h3>

    {{ form.as_p }} 
<!-- Why form.as_p?
It automatically displays all fields generated by UserCreationForm, including username, password, password confirmation, and validation errors. -->

    <button type="submit" class="btn btn-primary">
        Login
    </button>

</form>

{% endblock %}
