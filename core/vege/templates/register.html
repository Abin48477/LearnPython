{% extends "base.html" %}
{% block start %}

<form method="POST" class="col-6 mx-auto card p-3 shadow-lg">

    {% csrf_token %}

    <h3>Register</h3>

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Register
    </button>

</form>
<hr>

<h4>Registered Users (Testing Only)</h4>

{% for registered_user in registered_users %}

    <p>{{ registered_user.username }}</p>

{% empty %}

    <p>No users registered yet.</p>

{% endfor %}

{% endblock %}
