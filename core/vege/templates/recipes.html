{% extends "base.html" %}
{% block start %}
<h1>This is recipes.html</h1>
<div class="container mt-5">
    {% for message in messages %}
        <div class="alert alert-success" role="alert">{{ message }}</div>
    {% endfor %}

    <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h2>Add Recipe</h2>
        <div class="mb-3">
            <label for="exampleInput" class="form-label">Recipe Name:</label>
            <input name="recipe_name" required type="text" class="form-control">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Recipe Description:</label>
            <textarea name="recipe_description" required class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <label for="examplefile" class="form-label">Recipe Image:</label>
            <input name="recipe_image" type="file" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Add Recipe</button>
    </form>

</div>
{% endblock %}
