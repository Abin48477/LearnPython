{% extends "base.html" %}
{% block start %}

<!-- method="POST" tells Django to submit the form using POST.



action="POST" treats POST as part of the destination URL, which is the problem here. -->
<form method="POST" enctype ="multipart/form-data" class="col-6 mx-auto card p-3 shadow-lg">
    {% csrf_token %}
<h2>Edit Recipe</h2>

 <label class="form-label">Recipe Name</label>
        <input type="text" name="recipe_name"
               value="{{ recipe.recipe_name }}"
               class="form-control mb-3" required>
               <!-- form-control	Styles an input box -->
               <!-- mb-3	Adds space below -->

        <label class="form-label">Description</label>
        <textarea name="recipe_description"
                  class="form-control mb-3"
                  required>{{ recipe.recipe_description }}</textarea>

        <label class="form-label">Current Image</label>
        <!-- form-label	Styles a label -->
        {% if recipe.recipe_image %}

            <img src="{{ recipe.recipe_image.url }}" alt="This is recipe" width = "20%" >
            <p>{{ recipe.recipe_image.name }}</p>

        {% endif %}


        <label class="form-label">Choose New Image (optional)</label>
        <input type="file" name="recipe_image"
               class="form-control mb-3">
               <!-- Suggests image files in the file picker - * = any supported image subtype, such as PNG, JPEG, or WebP
This helps users choose images when uploading a recipe picture. It is not a security guarantee; your server should still validate uploaded files.-->

        <button type="submit" class="btn btn-success">
            Update Recipe
        </button>

        <a href="/recipes/" class="btn btn-secondary">
            Cancel
        </a>
</form>
{% endblock %}
